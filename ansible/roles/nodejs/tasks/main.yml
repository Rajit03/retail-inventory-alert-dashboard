---
- name: Ensure apt keyrings directory exists
  ansible.builtin.file:
    path: /etc/apt/keyrings
    state: directory
    owner: root
    group: root
    mode: "0755"
  tags: ['nodejs']

- name: Download NodeSource GPG key
  ansible.builtin.get_url:
    url: https://deb.nodesource.com/gpgkey/nodesource-repo.gpg.key
    dest: /etc/apt/keyrings/nodesource.asc
    owner: root
    group: root
    mode: "0644"
  tags: ['nodejs']

- name: Add NodeSource apt repository
  ansible.builtin.apt_repository:
    repo: "deb [signed-by=/etc/apt/keyrings/nodesource.asc] https://deb.nodesource.com/node_{{ node_major }}.x nodistro main"
    filename: nodesource
    state: present
  tags: ['nodejs']

- name: Install Node.js from NodeSource
  ansible.builtin.apt:
    name: nodejs
    state: present
    update_cache: true
  tags: ['nodejs']

- name: Assert node -v reports the configured major version
  ansible.builtin.command: node -v
  register: node_ver
  changed_when: false
  failed_when: not (node_ver.stdout | regex_search('^v' + (node_major | string) + '\\.'))
  tags: ['nodejs']
