---
- name: Assert deployment secrets are defined
  ansible.builtin.assert:
    that:
      - (session_secret is defined and session_secret | length > 0) or (SESSION_SECRET is defined and SESSION_SECRET | length > 0)
      - (seed_manager_password is defined and seed_manager_password | length >= 10) or (SEED_MANAGER_PASSWORD is defined and SEED_MANAGER_PASSWORD | length >= 10)
      - (seed_staff_password is defined and seed_staff_password | length >= 10) or (SEED_STAFF_PASSWORD is defined and SEED_STAFF_PASSWORD | length >= 10)
    fail_msg: "Deployment secrets must be provided via -e @secrets.yml with valid lengths."
  tags: ['app_service']

- name: Install application environment file
  ansible.builtin.template:
    src: retail-inventory.env.j2
    dest: "{{ env_dir }}/{{ app_name }}.env"
    owner: root
    group: "{{ app_group }}"
    mode: "0640"
  no_log: true
  tags: ['app_service']


- name: Install systemd unit
  ansible.builtin.template:
    src: retail-inventory.service.j2
    dest: /etc/systemd/system/{{ app_name }}.service
    owner: root
    group: root
    mode: "0644"
  notify: daemon-reload
  tags: ['app_service']

- name: Apply systemd unit changes
  ansible.builtin.meta: flush_handlers
  tags: ['app_service']

- name: Enable retail-inventory service
  ansible.builtin.systemd:
    name: "{{ app_name }}"
    enabled: true
    daemon_reload: true
  when: not ansible_check_mode
  tags: ['app_service']

- name: Check whether an application release exists
  ansible.builtin.stat:
    path: "{{ app_root }}/current/src/server.js"
  register: app_release
  tags: ['app_service']

- name: Start retail-inventory when a release exists
  ansible.builtin.systemd:
    name: "{{ app_name }}"
    state: started
  when:
    - not ansible_check_mode
    - app_release.stat.exists
  tags: ['app_service']

- name: Skip start until the first release is deployed
  ansible.builtin.debug:
    msg: "Service {{ app_name }} is enabled but not started; it will start after the first release is deployed ({{ app_root }}/current/src/server.js is missing)."
  when: not app_release.stat.exists
  tags: ['app_service']
