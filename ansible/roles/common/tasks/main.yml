---
- name: Update apt cache
  ansible.builtin.apt:
    update_cache: true
    cache_valid_time: 3600
  tags: ['common']

- name: Install base packages
  ansible.builtin.apt:
    name: "{{ base_packages }}"
    state: present
  tags: ['common']

- name: Create application group
  ansible.builtin.group:
    name: "{{ app_group }}"
    system: true
    state: present
  tags: ['common']

- name: Create application system user
  ansible.builtin.user:
    name: "{{ app_user }}"
    group: "{{ app_group }}"
    system: true
    shell: /usr/sbin/nologin
    home: "{{ app_root }}"
    create_home: false
    state: present
  tags: ['common']

- name: Create application directories
  ansible.builtin.file:
    path: "{{ item.path }}"
    state: directory
    owner: "{{ item.owner }}"
    group: "{{ item.group }}"
    mode: "{{ item.mode }}"
  loop:
    - path: "{{ app_root }}"
      owner: "{{ app_user }}"
      group: "{{ app_group }}"
      mode: "0755"
    - path: "{{ app_root }}/releases"
      owner: "{{ app_user }}"
      group: "{{ app_group }}"
      mode: "0755"
    - path: "{{ app_root }}/shared"
      owner: "{{ app_user }}"
      group: "{{ app_group }}"
      mode: "0750"
    - path: "{{ app_data_dir }}"
      owner: "{{ app_user }}"
      group: "{{ app_group }}"
      mode: "0750"
    - path: "{{ app_log_dir }}"
      owner: "{{ app_user }}"
      group: "{{ app_group }}"
      mode: "0750"
    - path: "{{ env_dir }}"
      owner: root
      group: "{{ app_group }}"
      mode: "0750"
  tags: ['common']
